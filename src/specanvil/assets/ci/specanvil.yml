# Fails the build when code changes break the specs (renamed/deleted symbols, or code changed
# since the spec was last verified). Runs fully inside CI; no AI calls, no external services.
name: specanvil
on:
  pull_request:
  push:
    branches: [main]
jobs:
  spec-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Replace with your published package or fork URL
      - run: pip install "specanvil @ git+https://github.com/YOUR_GITHUB_USER/specanvil"
      - run: specanvil drift --strict
      - run: specanvil docs check --strict
      - run: specanvil report
      - uses: actions/upload-artifact@v4
        with:
          name: specanvil-report
          path: .specanvil/report.html

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "specanvil"  # formerly SpecForge
version = "0.9.0"
description = "Turn any repo into spec-driven development in one command: a token-saving code-index MCP, project-tailored skills, agent team, and lifecycle commands from grooming to Playwright E2E."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mcp", "claude-code", "spec-driven-development", "agents", "code-index", "playwright"]
dependencies = [
  "mcp>=1.9,<3",
  "tree-sitter-language-pack>=0.9,<2",
  "pathspec>=0.12,<2",
]

[project.optional-dependencies]
semantic = ["fastembed>=0.3,<1"]

[project.scripts]
specanvil = "specanvil.cli:main"
specanvil-mcp = "specanvil.server:main"
# old names from before the rename, so repos set up as "SpecForge" keep working
specforge = "specanvil.cli:main"
specforge-mcp = "specanvil.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/specanvil"]

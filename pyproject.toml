[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "specforge"
version = "0.7.0"
description = "Turn any repo into spec-driven development in one command: a token-saving code-index MCP, project-tailored skills, agent team, and lifecycle commands from grooming to Playwright E2E."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mcp", "claude-code", "spec-driven-development", "agents", "code-index", "playwright"]
dependencies = [
  "mcp>=1.9",
  "tree-sitter-language-pack>=0.9",
  "pathspec>=0.12",
]

[project.optional-dependencies]
semantic = ["fastembed>=0.3"]

[project.scripts]
specforge = "specforge.cli:main"
specforge-mcp = "specforge.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/specforge"]

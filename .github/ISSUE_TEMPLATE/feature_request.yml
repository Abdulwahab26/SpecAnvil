name: Feature request
description: A tool, workflow, language or AI coding tool you want supported
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
  - type: textarea
    id: measure
    attributes:
      label: How we would know it works
      description: SpecAnvil changes ship with a test or a measurement. What should be measured here?

name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write   # for PyPI trusted publishing, once configured

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build pytest && pip install -e . && pytest -q
      - run: python -m build
      - name: GitHub release with changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk "/^## ${VER}\$/{f=1;next} /^## /{f=0} f" CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "SpecAnvil $VER" --notes-file notes.md
      # Publishes to PyPI as "specanvil" via trusted publishing (no token). Runs only after you:
      #   1. add this repo + workflow "release.yml" as a trusted publisher at pypi.org (Publishing settings), and
      #   2. set the repository variable PYPI_PUBLISH=true (Settings > Secrets and variables > Actions > Variables).
      - name: Publish to PyPI
        if: ${{ vars.PYPI_PUBLISH == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1

name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write   # for PyPI trusted publishing, once configured

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build pytest && pip install -e . && pytest -q
      - run: python -m build
      - name: GitHub release with changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk "/^## ${VER}\$/{f=1;next} /^## /{f=0} f" CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "SpecForge $VER" --notes-file notes.md
      # Enable after adding SpecForge as a trusted publisher on PyPI (no token needed):
      # - uses: pypa/gh-action-pypi-publish@release/v1
